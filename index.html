<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menü für die Woche</title>
<meta name="theme-color" content="#f7f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menü">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ec; --card:#fffdf9; --ink:#2b2620; --muted:#8a8073; --line:#e8e0d3;
  --accent:#c4552d; --accent-soft:#f6e3d9; --green:#5b7f4a; --green-soft:#e5eedc;
  --radius:14px; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:34px;margin:0;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:2px}
.weeknav{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.weeknav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--ink)}
.weeknav button:hover{background:var(--accent-soft)}
.weeknav .lbl{min-width:190px;text-align:center;font-weight:600}
.tabs{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.dname{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.dname small{font-family:Inter,sans-serif;font-weight:500;font-size:12px;color:var(--muted)}
.slot{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:62px;text-align:left;background:transparent;width:100%;display:flex;flex-direction:column;gap:2px;transition:.15s}
.slot:hover{border-color:var(--accent);background:var(--accent-soft)}
.slot .meal{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.slot .dish{font-weight:600;color:var(--ink)}
.slot .empty{color:var(--muted)}
.slot.filled{border-style:solid;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.shop-list{list-style:none;margin:0;padding:0;columns:2;column-gap:28px}
@media (max-width:700px){.shop-list{columns:1}}
.shop-list li{break-inside:avoid;display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.shop-list li.done span{text-decoration:line-through;color:var(--muted)}
.shop-list input{margin-top:3px;accent-color:var(--green);width:17px;height:17px}
.shop-list .for{display:block;font-size:12px;color:var(--muted)}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.recipe h3{margin:0;font-family:Fraunces,Georgia,serif;font-size:18px}
.recipe .ing{color:var(--muted);font-size:13px}
.recipe .acts{margin-top:auto;display:flex;gap:6px;padding-top:6px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green);font-weight:600;margin-right:4px}
.muted{color:var(--muted)}
.empty-state{text-align:center;padding:40px 10px;color:var(--muted)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,38,32,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--card);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 4px;font-family:Fraunces,Georgia,serif}
.field{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.field textarea{min-height:110px;resize:vertical}
.picklist{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;margin:8px 0}
.pick{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;text-align:left}
.pick:hover,.pick.sel{border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.status{font-size:12px;color:var(--muted);text-align:right;margin-top:24px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:420px){.tpls{grid-template-columns:1fr}}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 6px;font-weight:600}
.tt tbody th{width:34px}
.tt td{border-top:1px solid var(--line);padding:2px}
.cell{border:0;background:transparent;text-align:left;width:100%;padding:6px;border-radius:8px;color:var(--ink)}
.cell:hover{background:var(--accent-soft)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.badge{background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px}
.tab.on .badge{background:#fff;color:var(--ink)}
.chip{margin-top:4px;align-self:flex-start;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
.chip.hot{background:var(--accent);color:#fff}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.gh{font-family:Fraunces,Georgia,serif;font-size:17px;margin:18px 0 8px}
.sugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.modal .sugs{grid-template-columns:1fr}
.sug{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.sug.new{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sug-top{display:flex;justify-content:space-between;gap:8px}
.sug-name{font-weight:600;font-size:16px}
.small{font-size:13px}
.x{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%}
.x:hover{background:var(--line)}
.sug-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vote{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px}
.vote.on{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.sel{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;font:inherit;font-size:13px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin:14px 0 6px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.tpl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tpl-head h3{margin:0;font-family:Fraunces,Georgia,serif}

.login{max-width:520px}
.login h2{margin:0 0 6px;font-family:Fraunces,Georgia,serif}
.status a{color:inherit}
code{background:var(--bg);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===================================================================
//  EINSTELLUNGEN – hier die zwei Werte aus Supabase eintragen
//  (Supabase → Project Settings → API)
// ===================================================================
var SUPABASE_URL = "https://ypifgcqachkzozhjonvn.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_n7wn0upCrbQa7Yg-RS6MxA_nkxVle7P";
// ===================================================================

(function(){
  "use strict";
  var app=document.getElementById("app");
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
  function shell(inner){app.innerHTML='<div class="wrap"><header><div><h1>Menü <span>für die Woche</span></h1><div class="sub">Gemeinsam planen, vorschlagen, einkaufen.</div></div></header><div class="card login">'+inner+'</div></div>';}

  if(/DEIN-PROJEKT|DEIN-ANON-KEY/.test(SUPABASE_URL+SUPABASE_ANON_KEY)||!window.supabase){
    shell('<h2>Fast geschafft!</h2><p class="muted">Trage in der Datei <b>index.html</b> ganz oben bei <code>SUPABASE_URL</code> und <code>SUPABASE_ANON_KEY</code> die Werte aus deinem Supabase-Projekt ein (Project Settings → API).</p>');
    return;
  }
  var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

  function showLogin(msg){
    shell('<h2>Anmelden</h2><p class="muted">Gib deine E-Mail-Adresse ein. Du bekommst einen Link, mit dem du dich anmeldest – ganz ohne Passwort.</p>'+
      '<form id="loginf" class="addrow"><input type="email" name="email" required placeholder="name@beispiel.ch" autocomplete="email"><button class="btn primary">Login-Link senden</button></form>'+
      (msg?'<p class="note" style="margin-top:14px">'+msg+'</p>':''));
    document.getElementById("loginf").addEventListener("submit",function(e){
      e.preventDefault();var email=e.target.elements.email.value.trim();if(!email)return;
      var btn=e.target.querySelector("button");btn.disabled=true;btn.textContent="Sende …";
      sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.origin+location.pathname}}).then(function(r){
        if(r.error)showLogin("Das hat nicht geklappt: "+esc(r.error.message));
        else showLogin("📬 Schau in dein Postfach (<b>"+esc(email)+"</b>) und tippe auf den Link. Du kannst dieses Fenster schliessen.");
      });
    });
  }

  function clone(o){return o==null?o:JSON.parse(JSON.stringify(o));}
  function deepMerge(a,b){
    if(!a||typeof a!=="object"||Array.isArray(a)||!b||typeof b!=="object"||Array.isArray(b))return b;
    Object.keys(b).forEach(function(k){var bv=b[k],av=a[k];a[k]=(bv&&typeof bv==="object"&&!Array.isArray(bv)&&av&&typeof av==="object"&&!Array.isArray(av))?deepMerge(av,bv):bv;});
    return a;
  }
  function collOf(p){return p.split("/").slice(0,-1).join("/");}
  function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

  function makeBackend(email,members){
    var cache={},listeners=[];
    function snapFor(c){var docs=Object.keys(cache).filter(function(p){return collOf(p)===c;}).map(function(p){var d=cache[p];return {id:p.split("/").pop(),exists:true,data:function(){return d;},metadata:{fromCache:false,hasPendingWrites:false}};});return {docs:docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:function(){return [];}};}
    function emit(c){listeners.forEach(function(l){if(l.c===c)l.cb(snapFor(c));});}
    function emitAll(){listeners.forEach(function(l){l.cb(snapFor(l.c));});}
    function err(e){var rls=e&&(e.code==="42501"||/row-level security|permission/i.test(e.message||""));return {code:rls?"invalid_argument":"unavailable",message:e&&e.message};}
    function loadAll(){return sb.from("docs").select("path,data").then(function(r){if(r.error)throw r.error;var n={};r.data.forEach(function(row){n[row.path]=row.data;});cache=n;});}
    var ready=loadAll();
    sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},function(p){
      if(p.eventType==="DELETE"){var path=p.old&&p.old.path;if(path&&cache[path]){delete cache[path];emit(collOf(path));}}
      else if(p.new&&p.new.path){cache[p.new.path]=p.new.data;emit(collOf(p.new.path));}
    }).subscribe();
    document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")loadAll().then(emitAll,function(){});});
    function check(r){if(r.error)throw err(r.error);}
    function docRef(path){return {id:path.split("/").pop(),path:path,
      set:function(d){cache[path]=clone(d);emit(collOf(path));return sb.from("docs").upsert({path:path,data:d,updated_at:new Date().toISOString()}).then(check);},
      update:function(d){cache[path]=deepMerge(clone(cache[path])||{},clone(d));emit(collOf(path));return sb.rpc("merge_doc",{p_path:path,p_patch:d}).then(check);},
      delete:function(){delete cache[path];emit(collOf(path));return sb.from("docs").delete().eq("path",path).then(check);}
    };}
    var db={doc:docRef,collection:function(c){return {path:c,doc:function(id){return docRef(c+"/"+(id||newId()));},
      onSnapshot:function(cb,eb){var l={c:c,cb:cb};listeners.push(l);ready.then(function(){cb(snapFor(c));},function(e){if(eb)eb(err(e));});return function(){listeners=listeners.filter(function(x){return x!==l;});};}};}};
    var names={};members.forEach(function(m){names[m.email.toLowerCase()]=m.name;});
    var user={id:function(){return Promise.resolve(email);},can:function(){return Promise.resolve(true);},
      profiles:function(ids){var o={};ids.forEach(function(id){o[id]={name:names[String(id).toLowerCase()]||""};});return Promise.resolve(o);}};
    return {db:db,user:user,email:email,logout:function(){sb.auth.signOut().then(function(){location.reload();});}};
  }

  var started=false;
  function boot(session){
    if(started)return;
    if(!session){showLogin();return;}
    started=true;
    var email=(session.user&&session.user.email||"").toLowerCase();
    shell('<p class="muted">Lade euren Plan …</p>');
    sb.from("members").select("email,name").then(function(r){
      if(r.error||!r.data||!r.data.some(function(m){return m.email.toLowerCase()===email;})){
        shell('<h2>Kein Zugriff</h2><p class="muted">Die Adresse <b>'+esc(email)+'</b> ist nicht als Mitglied eingetragen. Trage sie in Supabase in der Tabelle <code>members</code> ein.</p><button class="btn" id="lo">Abmelden</button>');
        document.getElementById("lo").onclick=function(){sb.auth.signOut().then(function(){location.reload();});};
        return;
      }
      if(location.hash.indexOf("access_token")>=0)history.replaceState(null,"",location.pathname);
      window.startApp(makeBackend(email,r.data));
    });
  }
  sb.auth.getSession().then(function(r){boot(r.data&&r.data.session);});
  sb.auth.onAuthStateChange(function(ev,session){if(ev==="SIGNED_IN"&&session)boot(session);});
})();

</script>
<script>
window.startApp=function(backend){
  "use strict";
  var DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
  var MEALS=[["mittag","Mittag"],["abend","Abend"]];
  var D={recipes:{},templates:{},weeks:{},sugg:{}};
  var loaded={recipes:false,templates:false,weeks:false,sugg:false};
  var ui={tab:"plan",offset:0,modal:null,mode:"set"};
  var db=null,user=null,me=null,readOnly=false,conn="connecting",names={},asked={};

  // ---------- helpers ----------
  function monday(off){var d=new Date();d.setHours(0,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+off*7);return d;}
  function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return [t.getUTCFullYear(),Math.ceil(((t-y)/864e5+1)/7)];}
  function weekKey(off){var w=isoWeek(monday(off));return w[0]+"-W"+(w[1]<10?"0":"")+w[1];}
  function kwOf(key){return +key.split("-W")[1];}
  function fmt(d){return d.getDate()+"."+(d.getMonth()+1)+".";}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
  function recipe(id){return D.recipes[id]||null;}
  function recipesSorted(){return Object.keys(D.recipes).map(function(k){return D.recipes[k];}).filter(function(r){return r&&r.name;}).sort(function(a,b){return a.name.localeCompare(b.name,"de");});}
  function tplsSorted(){return Object.keys(D.templates).map(function(k){return D.templates[k];}).sort(function(a,b){return String(a.name).localeCompare(String(b.name),"de",{numeric:true});});}
  function week(key){return D.weeks[key]||{days:{},extra:[],checked:{}};}
  function slotOf(days,day,meal){var d=days&&days[day];return d&&d[meal]||null;}
  function label(v){if(!v)return "";if(v.id){var r=recipe(v.id);return r?r.name:"";}return v.text||"";}
  function nameOf(id){if(id&&id===me)return "Du";return names[id]||"Partner:in";}
  function sugList(){return Object.keys(D.sugg).map(function(k){return D.sugg[k];}).sort(function(a,b){return (b.at||0)-(a.at||0);});}
  function sugFor(wk,day,meal){return sugList().filter(function(s){return s.week===wk&&s.day===day&&s.meal===meal;});}
  function isNew(s){return s.by!==me&&!(s.votes&&s.votes[me]);}
  function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2800);}

  // ---------- writes (one at a time per document) ----------
  var chains={};
  function write(path,op){
    if(!db||readOnly){toast(readOnly?"Du hast nur Lesezugriff.":"Keine Verbindung.");return Promise.resolve();}
    var p=(chains[path]||Promise.resolve()).then(function(){return op(db.doc(path));}).catch(function(e){
      if(e&&e.code==="invalid_argument"){readOnly=true;toast("Nur Lesezugriff – Änderungen sind nicht möglich.");render();}
      else if(e&&e.code==="quota_exceeded")toast("Speicher voll – bitte alte Einträge löschen.");
      else toast("Speichern fehlgeschlagen, bitte nochmals versuchen.");
    });
    chains[path]=p;return p;
  }
  function norm(v){return v?{id:v.id||null,text:v.text||null}:null;}
  function setSlotWeek(key,day,meal,val){val=norm(val);
    var ex=D.weeks[key], patch={days:{}}; patch.days[day]={}; patch.days[day][meal]=val||null;
    if(ex)write("weeks/"+key,function(r){return r.update(patch);});
    else{var w={days:patch.days,extra:[],checked:{}};D.weeks[key]=w;write("weeks/"+key,function(r){return r.set(w);});}
  }
  function setSlotTpl(tid,day,meal,val){val=norm(val);var patch={days:{}};patch.days[day]={};patch.days[day][meal]=val||null;write("templates/"+tid,function(r){return r.update(patch);});}
  function weekPatch(key,patch){
    if(D.weeks[key])write("weeks/"+key,function(r){return r.update(patch);});
    else{var w={days:{},extra:[],checked:{}};Object.keys(patch).forEach(function(k){w[k]=patch[k];});D.weeks[key]=w;write("weeks/"+key,function(r){return r.set(w);});}
  }
  function replaceWeekDays(key,days){var w=week(key);var nw={days:days,extra:w.extra||[],checked:w.checked||{}};write("weeks/"+key,function(r){return r.set(nw);});}

  // ---------- render ----------
  function render(){
    var app=document.getElementById("app");
    var a=document.activeElement, keep=null;
    if(a&&app.contains(a)&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.type!=="checkbox"){keep={sel:a.hasAttribute("data-filter")?"[data-filter]":a.name?'[name="'+a.name+'"]':null,val:a.value,s:a.selectionStart,e:a.selectionEnd};}

    if((el=t.closest("[data-plan]"))){var id=el.dataset.plan,dd=document.querySelector('[data-pday="'+id+'"]').value,mm=document.querySelector('[data-pmeal="'+id+'"]').value;acceptSugg(id,+dd,mm,weekKey(ui.offset));render();return;}
    if((el=t.closest("[data-sdel]"))){var sid=el.dataset.sdel;write("suggestions/"+sid,function(r){return r.delete();});return;}
    if((el=t.closest("[data-edit]"))){open({type:"recipe",id:el.dataset.edit});return;}
    if((el=t.closest("[data-del]"))){var rid=el.dataset.del,r=recipe(rid);open({type:"confirm",title:"«"+r.name+"» löschen?",text:"Das Gericht verschwindet aus der Liste und aus allen Plänen.",ok:"Löschen",run:function(){write("recipes/"+rid,function(x){return x.delete();});}});return;}
    if((el=t.closest("[data-deltpl]"))){var tid=el.dataset.deltpl;open({type:"confirm",title:"«"+D.templates[tid].name+"» löschen?",text:"Bereits geplante Wochen bleiben unverändert.",ok:"Löschen",run:function(){write("templates/"+tid,function(x){return x.delete();});}});return;}
    if((el=t.closest("[data-delx]"))){e.preventDefault();var key=weekKey(ui.offset),ex=(week(key).extra||[]).slice();ex.splice(+el.dataset.delx,1);weekPatch(key,{extra:ex});return;}
    if((el=t.closest("[data-a]"))&&actions[el.dataset.a]){actions[el.dataset.a]();}
  });
  function pick(val){
    var m=ui.modal;if(!m)return;
    if(m.type==="newsugg"){var ds=document.querySelector("[data-nday]").value,ms=document.querySelector("[data-nmeal]").value;addSugg(ds===""?null:+ds,ms,val);ui.modal=null;ui.tab="sugg";render();return;}
    if(m.tpl){setSlotTpl(m.tpl,m.day,m.meal,val);}
    else if(ui.mode==="suggest"){addSugg(m.day,m.meal,val);}
    else setSlotWeek(weekKey(ui.offset),m.day,m.meal,val);
    ui.modal=null;render();
  }
  document.addEventListener("change",function(e){
    var k=e.target.dataset&&e.target.dataset.chk;if(k===undefined)return;
    var patch={checked:{}};patch.checked[k]=e.target.checked?true:null;weekPatch(weekKey(ui.offset),patch);
  });
  document.addEventListener("input",function(e){if(e.target.hasAttribute("data-filter")&&ui.modal){ui.modal.q=e.target.value;render();}});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ui.modal){ui.modal=null;render();}});
  document.addEventListener("submit",function(e){
    e.preventDefault();var f=e.target,kind=f.dataset.form;
    if(kind==="free"){var t=f.elements.t.value.trim();if(!t&&ui.modal.type==="newsugg")return;if(!t&&ui.mode==="suggest"&&!ui.modal.tpl)return;pick(t?{text:t}:null);}
    else if(kind==="recipe"){
      var name=f.elements.name.value.trim();if(!name)return;
      var data={name:name,ingredients:f.elements.ing.value.split(/\n|,/).map(function(s){return s.trim();}).filter(Boolean),tags:f.elements.tags.value.split(",").map(function(s){return s.trim();}).filter(Boolean)};
      var id=ui.modal.id||db.collection("recipes").doc().id;
      write("recipes/"+id,function(r){return r.set(data);});ui.modal=null;render();
    } else if(kind==="extra"){var x=f.elements.x.value.trim();if(!x)return;var key=weekKey(ui.offset);weekPatch(key,{extra:(week(key).extra||[]).concat([x])});f.elements.x.value="";}
  });

  // ---------- connect ----------
  function resolveNames(){
    if(!user)return;var ids=[];sugList().forEach(function(s){if(s.by&&s.by!==me&&!asked[s.by]){asked[s.by]=1;ids.push(s.by);}});
    if(!ids.length)return;
    user.profiles(ids).then(function(ps){ids.forEach(function(id){var p=ps&&ps[id];if(p&&p.name)names[id]=p.name.split(" ")[0];});render();},function(){});
  }
  function sub(coll,key){
    db.collection(coll).onSnapshot(function(snap){
      var o={};snap.docs.forEach(function(d){var v=d.data();if(!v)return;var c=JSON.parse(JSON.stringify(v));c.id=d.id;o[d.id]=c;});
      D[key]=o;loaded[key]=true;
      if(!snap.metadata.fromCache){clearTimeout(slowTimer);if(conn!=="live"){conn="live";}}
      if(key==="sugg")resolveNames();
      render();
    },function(err){loaded[key]=true;if(err&&err.code==="revoked"){readOnly=true;}conn="slow";render();});
  }
  var slowTimer;
  render();
  var use=function(n){return Promise.resolve(n==="db"?backend.db:n==="user"?backend.user:null);};
  Promise.all([use("db"),use("user")]).then(function(r){
    db=r[0];user=r[1];
    if(!db){conn="nodb";render();return;}
    return (user?user.id():Promise.resolve(null)).then(function(id){
      me=id||"anon";
      if(user&&user.can){user.can("data.write").then(function(ok){if(ok===false){readOnly=true;render();}},function(){});}
      slowTimer=setTimeout(function(){if(conn!=="live"){conn="slow";render();}},10000);
      sub("recipes","recipes");sub("templates","templates");sub("weeks","weeks");sub("suggestions","sugg");
    });
  },function(){conn="nodb";render();});
};

</script>
</body>
</html>
