<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochenmenü</title>
<meta name="theme-color" content="#f6f7f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wochenmenü">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#15181d; --ink2:#4a515c; --muted:#8a919c; --line:#eceef2; --line2:#e2e5ea;
  --accent:#1a8a5a; --accent-ink:#0f6b44; --accent-soft:#e8f5ee; --hot:#ff6a3d; --hot-soft:#fff0ea;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
  --shadow-lg:0 12px 40px rgba(16,24,40,.16);
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:.92em}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px}

.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 40px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px}
h1{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.weeknav{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.nav-ic{border:0;background:transparent;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink2)}
.nav-ic:hover{background:var(--bg)}
.todaybtn{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink2)}
.todaybtn.on{background:var(--accent-soft);color:var(--accent-ink)}

/* tabs: desktop segmented, mobile bottom bar */
.tabs{display:flex;gap:4px;background:#eceef1;padding:4px;border-radius:14px;margin-bottom:18px;width:max-content;max-width:100%}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--ink2);transition:background .15s,color .15s}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.ti{position:relative;display:inline-flex}
.ti svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-6px;right:-9px;background:var(--hot);color:#fff;border-radius:999px;min-width:17px;height:17px;padding:0 5px;font-size:10.5px;line-height:17px;text-align:center;font-weight:700;border:2px solid #eceef1}
.tab.on .badge{border-color:var(--card)}

/* chips / buttons */
.chips{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line2);background:var(--card);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.pill:hover{border-color:#cfd4db}
.pill.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{border:1px solid var(--line2);background:var(--card);padding:9px 15px;border-radius:12px;font-weight:600;font-size:14px}
.btn:hover{border-color:#cfd4db}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

/* week grid */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent}
.day.today{border-color:var(--accent)}
.dname{display:flex;align-items:baseline;gap:6px;padding:2px 4px 4px;flex-wrap:wrap}
.dn-long{display:none}
.dn-short{font-weight:700;font-size:16px}
.dname small{color:var(--muted);font-size:12px}
.ttag{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.slot{border:0;background:var(--bg);border-radius:var(--r-sm);padding:9px 10px;min-height:64px;text-align:left;width:100%;display:flex;flex-direction:column;gap:2px;transition:background .15s,transform .1s}
.slot:hover{background:#eef0f3}
.slot:active{transform:scale(.98)}
.slot.filled{background:var(--accent-soft)}
.slot.filled:hover{background:#dcefe5}
.meal{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.slot.filled .meal{color:var(--accent-ink);opacity:.7}
.dish{font-weight:600;font-size:14px;line-height:1.3;color:var(--ink)}
.empty{color:var(--muted);font-size:13.5px}
.empty::before{content:"+ "}
.chip{margin-top:5px;align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff;color:var(--ink2);box-shadow:var(--shadow)}
.chip.hot{background:var(--hot);color:#fff}

/* cards & generic */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.empty-state{text-align:center;padding:44px 16px;color:var(--muted)}
.note{background:var(--hot-soft);color:#8a3415;border-radius:var(--r-sm);padding:10px 14px;margin-bottom:12px;font-size:14px}
.gh{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:20px 2px 10px;font-weight:700}
.status{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:28px}
.status a{color:inherit}
.dot{width:7px;height:7px;border-radius:50%;background:#c3c8cf}
.dot.live{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}

/* suggestions */
.sugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.modal .sugs{grid-template-columns:1fr}
.sug{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;border:1.5px solid transparent}
.modal .sug{box-shadow:none;border-color:var(--line)}
.sug.new{border-color:var(--hot)}
.sug-top{display:flex;justify-content:space-between;gap:8px}
.sug-name{font-weight:700;font-size:16px;margin-bottom:2px}
.x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;flex:none}
.x:hover{background:var(--bg)}
.sug-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vote{border:0;background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.vote.on{background:var(--accent-soft);color:var(--accent-ink)}
.sel{border:1px solid var(--line2);border-radius:10px;padding:6px 8px;background:#fff;font-size:13px}

/* shopping */
.shop-list{list-style:none;margin:0;padding:0;columns:2;column-gap:32px}
.shop-list li{break-inside:avoid;display:flex;align-items:flex-start;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.shop-list li.done>span{color:var(--muted);text-decoration:line-through}
.shop-list input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #cfd4db;margin:0;display:grid;place-items:center;cursor:pointer;transition:.15s}
.shop-list input:checked{background:var(--accent);border-color:var(--accent)}
.shop-list input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.shop-list .for{display:block;font-size:12px;color:var(--muted);text-decoration:none}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:#fff}
.addrow input:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* templates */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.tpl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tpl-head h3{margin:0;font-size:17px}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 6px;font-weight:700}
.tt tbody th{width:36px}
.tt td{border-top:1px solid var(--line);padding:2px}
.cell{border:0;background:transparent;text-align:left;width:100%;padding:7px 6px;border-radius:8px}
.cell:hover{background:var(--bg)}

/* recipes */
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.recipe{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.recipe h3{margin:0;font-size:16px}
.recipe .ing{color:var(--muted);font-size:13px}
.recipe .acts{margin-top:auto;display:flex;gap:6px;padding-top:6px}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--ink2);font-weight:600;margin-right:4px}

/* modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(15,18,24,.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30;animation:fade .15s ease}
.modal{background:var(--card);border-radius:22px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal h2{margin:0 0 4px;font-size:20px;letter-spacing:-.2px}
.field{display:flex;flex-direction:column;gap:5px;margin:14px 0}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field textarea{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:#fff}
.field textarea{min-height:110px;resize:vertical}
.picklist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto;margin:6px 0;border-radius:12px}
.pick{border:0;background:transparent;border-radius:10px;padding:10px 12px;text-align:left;font-weight:500}
.pick:hover{background:var(--bg)}
.pick.sel{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.seg{display:flex;background:#eceef1;border-radius:12px;padding:3px;margin:16px 0 6px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;z-index:40;box-shadow:var(--shadow-lg);animation:pop .18s ease;max-width:90vw}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.toast{animation:none}

/* login */
.login{max-width:480px;margin:40px auto 0}
.login h2{margin:0 0 6px;font-size:20px}

/* ---------- tablet ---------- */
@media (max-width:1100px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .day{flex-direction:column}
  .dn-long{display:inline;font-weight:700;font-size:16px}
  .dn-short{display:none}
  .slot{min-height:56px}
}
/* ---------- phone ---------- */
@media (max-width:680px){
  .wrap{padding:14px 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
  .top{margin-bottom:14px}
  .brand .logo{width:38px;height:38px;border-radius:12px;font-size:19px}
  h1{font-size:21px}
  .weeknav{width:100%;justify-content:space-between}
  .todaybtn{flex:1}
  .grid{grid-template-columns:1fr;gap:10px}
  .day{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px}
  .dname{grid-column:1/-1}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;width:auto;border-radius:0;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20;justify-content:space-around}
  .tab{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;background:transparent!important;box-shadow:none!important;color:var(--muted)}
  .tab.on{color:var(--accent)}
  .ti svg{width:23px;height:23px}
  .badge{border-color:#fff}
  .shop-list{columns:1}
  .tpls,.sugs,.recipes{grid-template-columns:1fr}
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:22px 22px 0 0;max-height:88vh;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:sheet .22s ease}
  .modal::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:#d7dbe0;margin:0 auto 12px}
  .toast{bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom))}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}

/* ---------- Einkauf: Kacheln ---------- */
.quickadd{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.quickadd .qa-ic{color:var(--accent);font-size:20px;font-weight:700}
.quickadd input{flex:1;min-width:0;border:0;background:transparent;padding:8px 2px;font-size:15px;outline:none}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{border:0;border-radius:16px;background:var(--accent);color:#fff;aspect-ratio:1/1;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;box-shadow:0 2px 6px rgba(26,138,90,.25);transition:transform .12s,opacity .18s}
.tile:active{transform:scale(.94)}
.tile .te{font-size:34px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.tile .tn{font-size:12.5px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tile.got{background:var(--card);color:var(--muted);box-shadow:var(--shadow)}
.tile.got .te{filter:grayscale(1);opacity:.55}
.tile.pop-out{transform:scale(.85);opacity:0}
.got-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
@media (max-width:680px){.tiles{grid-template-columns:repeat(3,1fr)}.tile .te{font-size:36px}}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}}
img.logo{display:block;object-fit:cover;padding:0}
.codein{font-size:26px;letter-spacing:8px;text-align:center;font-variant-numeric:tabular-nums}
.login .btn.primary{padding:12px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.startApp=function(backend){
  "use strict";
  var DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
  var MEALS=[["mittag","Mittag"],["abend","Abend"]];
  var D={recipes:{},templates:{},weeks:{},sugg:{}};
  var loaded={recipes:false,templates:false,weeks:false,sugg:false};
  var ui={tab:"plan",offset:0,modal:null,mode:"set"};
  var db=null,user=null,me=null,readOnly=false,conn="connecting",names={},asked={};

  // ---------- helpers ----------
  function monday(off){var d=new Date();d.setHours(0,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+off*7);return d;}
  function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return [t.getUTCFullYear(),Math.ceil(((t-y)/864e5+1)/7)];}
  function weekKey(off){var w=isoWeek(monday(off));return w[0]+"-W"+(w[1]<10?"0":"")+w[1];}
  function kwOf(key){return +key.split("-W")[1];}
  function fmt(d){return d.getDate()+"."+(d.getMonth()+1)+".";}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
  function recipe(id){return D.recipes[id]||null;}
  function recipesSorted(){return Object.keys(D.recipes).map(function(k){return D.recipes[k];}).filter(function(r){return r&&r.name;}).sort(function(a,b){return a.name.localeCompare(b.name,"de");});}
  function tplsSorted(){return Object.keys(D.templates).map(function(k){return D.templates[k];}).sort(function(a,b){return String(a.name).localeCompare(String(b.name),"de",{numeric:true});});}
  function week(key){return D.weeks[key]||{days:{},extra:[],checked:{}};}
  function slotOf(days,day,meal){var d=days&&days[day];return d&&d[meal]||null;}
  function label(v){if(!v)return "";if(v.id){var r=recipe(v.id);return r?r.name:"";}return v.text||"";}
  function nameOf(id){if(id&&id===me)return "Du";return names[id]||"Partner:in";}
  function sugList(){return Object.keys(D.sugg).map(function(k){return D.sugg[k];}).sort(function(a,b){return (b.at||0)-(a.at||0);});}
  function sugFor(wk,day,meal){return sugList().filter(function(s){return s.week===wk&&s.day===day&&s.meal===meal;});}
  function isNew(s){return s.by!==me&&!(s.votes&&s.votes[me]);}
  function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},2800);}

  // ---------- writes (one at a time per document) ----------
  var chains={};
  function write(path,op){
    if(!db||readOnly){toast(readOnly?"Du hast nur Lesezugriff.":"Keine Verbindung.");return Promise.resolve();}
    var p=(chains[path]||Promise.resolve()).then(function(){return op(db.doc(path));}).catch(function(e){
      if(e&&e.code==="invalid_argument"){readOnly=true;toast("Nur Lesezugriff – Änderungen sind nicht möglich.");render();}
      else if(e&&e.code==="quota_exceeded")toast("Speicher voll – bitte alte Einträge löschen.");
      else toast("Speichern fehlgeschlagen, bitte nochmals versuchen.");
    });
    chains[path]=p;return p;
  }
  function norm(v){return v?{id:v.id||null,text:v.text||null}:null;}
  function setSlotWeek(key,day,meal,val){val=norm(val);
    var ex=D.weeks[key], patch={days:{}}; patch.days[day]={}; patch.days[day][meal]=val||null;
    if(ex)write("weeks/"+key,function(r){return r.update(patch);});
    else{var w={days:patch.days,extra:[],checked:{}};D.weeks[key]=w;write("weeks/"+key,function(r){return r.set(w);});}
  }
  function setSlotTpl(tid,day,meal,val){val=norm(val);var patch={days:{}};patch.days[day]={};patch.days[day][meal]=val||null;write("templates/"+tid,function(r){return r.update(patch);});}
  function weekPatch(key,patch){
    if(D.weeks[key])write("weeks/"+key,function(r){return r.update(patch);});
    else{var w={days:{},extra:[],checked:{}};Object.keys(patch).forEach(function(k){w[k]=patch[k];});D.weeks[key]=w;write("weeks/"+key,function(r){return r.set(w);});}
  }
  function replaceWeekDays(key,days){var w=week(key);var nw={days:days,extra:w.extra||[],checked:w.checked||{}};write("weeks/"+key,function(r){return r.set(nw);});}

  // ---------- render ----------
  var MONTHS=["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sept","Okt","Nov","Dez"];
  function dlong(d){return d.getDate()+". "+MONTHS[d.getMonth()];}
  var ICON={

  }
  function open(m){ui.modal=m;ui.justOpened=true;render();}

  // ---------- actions ----------
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function addSugg(day,meal,val){
    var ref=db.collection("suggestions").doc();
    var s={week:day==null?null:weekKey(ui.offset),day:day,meal:day==null?null:meal,recipeId:val.id||null,text:val.text||null,by:me,at:Date.now(),votes:{}};

    togglegot:function(){ui.showGot=!ui.showGot;render();},
    clearextra:function(){var key=weekKey(ui.offset),w=week(key),chk=w.checked||{},keep=[],pc={};(w.extra||[]).forEach(function(e){var k="x:"+e.toLowerCase();if(chk[k])pc[k]=null;else keep.push(e);});weekPatch(key,{extra:keep,checked:pc});},

    } else if(kind==="extra"){var x=f.elements.x.value.trim();if(!x)return;var key=weekKey(ui.offset),lx=x.toLowerCase(),ex=week(key).extra||[],hit=shopAll(key).filter(function(i){return i.name.toLowerCase()===lx;})[0];f.elements.x.value="";
      if(hit){if(hit.on){var pc={checked:{}};pc.checked[hit.k]=null;weekPatch(key,pc);}else toast("«"+hit.name+"» steht schon auf der Liste.");}
      else weekPatch(key,{extra:ex.concat([x])});}
  });

  // ---------- connect ----------
  function resolveNames(){
    if(!user)return;var ids=[];sugList().forEach(function(s){if(s.by&&s.by!==me&&!asked[s.by]){asked[s.by]=1;ids.push(s.by);}});

  function sub(coll,key){
    db.collection(coll).onSnapshot(function(snap){
      var o={};snap.docs.forEach(function(d){var v=d.data();if(!v)return;var c=JSON.parse(JSON.stringify(v));c.id=d.id;o[d.id]=c;});
      D[key]=o;loaded[key]=true;
      if(!snap.metadata.fromCache){clearTimeout(slowTimer);if(conn!=="live"){conn="live";}}
      if(key==="sugg")resolveNames();
      render();
    },function(err){loaded[key]=true;if(err&&err.code==="revoked"){readOnly=true;}conn="slow";render();});
  }
  var slowTimer;
  render();
  var use=function(n){return Promise.resolve(n==="db"?backend.db:n==="user"?backend.user:null);};
  Promise.all([use("db"),use("user")]).then(function(r){
    db=r[0];user=r[1];
    if(!db){conn="nodb";render();return;}
    return (user?user.id():Promise.resolve(null)).then(function(id){
      me=id||"anon";
      if(user&&user.can){user.can("data.write").then(function(ok){if(ok===false){readOnly=true;render();}},function(){});}
      slowTimer=setTimeout(function(){if(conn!=="live"){conn="slow";render();}},10000);

  function collOf(p){return p.split("/").slice(0,-1).join("/");}

      delete:function(){delete cache[path];emit(collOf(path));return sb.from("docs").delete().eq("path",path).then(check);}
    };}
    var db={doc:docRef,collection:function(c){return {path:c,doc:function(id){return docRef(c+"/"+(id||newId()));},

    var user={id:function(){return Promise.resolve(email);},can:function(){return Promise.resolve(true);},
      profiles:function(ids){var o={};ids.forEach(function(id){o[id]={name:names[String(id).toLowerCase()]||""};});return Promise.resolve(o);}};
    return {db:db,user:user,email:email,logout:function(){sb.auth.signOut().then(function(){location.reload();});},setPassword:function(pw){return sb.auth.updateUser({password:pw}).then(function(r){if(r.error)throw r.error;});}};
  }

  var started=false;
  function boot(session){
    if(started)return;
    if(!session){showLogin();return;}
    started=true;
    var email=(session.user&&session.user.email||"").toLowerCase();
    shell('<p class="muted">Lade euren Plan …</p>');
    sb.from("members").select("email,name").then(function(r){
      if(r.error||!r.data||!r.data.some(function(m){return m.email.toLowerCase()===email;})){
        shell('<h2>Kein Zugriff</h2><p class="muted">Die Adresse <b>'+esc(email)+'</b> ist nicht als Mitglied eingetragen. Trage sie in Supabase in der Tabelle <code>members</code> ein.</p><button class="btn" id="lo">Abmelden</button>');
        document.getElementById("lo").onclick=function(){sb.auth.signOut().then(function(){location.reload();});};
        return;
      }
      if(location.hash.indexOf("access_token")>=0)history.replaceState(null,"",location.pathname);
      window.startApp(makeBackend(email,r.data));
    });
  }
  sb.auth.getSession().then(function(r){boot(r.data&&r.data.session);});
  sb.auth.onAuthStateChange(function(ev,session){if(ev==="SIGNED_IN"&&session)boot(session);});
})();

</script>
</body>
</html>
